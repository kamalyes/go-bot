on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"

name: Tests
jobs:
  Build:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
        continue-on-error: true

      # 单模块仓库：根目录统一测试，coverage.txt 供 Codecov 上传
      - name: Test (with coverage)
        run: |
          set -e
          if command -v gotestsum >/dev/null 2>&1; then
            gotestsum -f testname -- ./... -race -count=1 -timeout=10m -coverprofile="coverage.txt" -covermode=atomic -shuffle=on
          else
            go test ./... -race -count=1 -timeout=10m -coverprofile="coverage.txt" -covermode=atomic -shuffle=on
          fi
        timeout-minutes: 30
        continue-on-error: true # 即使测试失败也继续

      - name: Check coverage files exist
        id: check_coverage
        if: matrix.go-version == '1.25.x'
        run: |
          if ls coverage.txt >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Coverage files exist"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No coverage files found"
          fi
        shell: bash
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        if: always() && steps.check_coverage.outputs.exists == 'true'
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          slug: kamalyes/go-bot
          fail_ci_if_error: false # 上传失败不影响 CI
        continue-on-error: true # 上传失败也不影响整个流程
